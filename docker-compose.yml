services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p ${POSTGRES_PORT}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    image: logini228/aichat-backend:v7
    env_file:
      - .env
    networks:
      - backend_net
      - frontend_net
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    image: logini228/aichat-frontend:v7
    ports:
      - "3000:3000"
    networks:
      - frontend_net
    depends_on:
      - backend

networks:
  backend_net:
    driver: bridge
  frontend_net:
    driver: bridge

volumes:
  pgdata: